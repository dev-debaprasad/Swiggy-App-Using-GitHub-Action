name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Uncomment to fail the job if Quality Gate fails
      # - uses: sonarsource/sonarqube-quality-gate-action@master
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Docker build and push to ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 171257943898.dkr.ecr.us-east-1.amazonaws.com
          docker build -t sonar-ecr -f deployment-using-github-actions/Dockerfile deployment-using-github-actions/
          docker tag sonar-ecr:latest 171257943898.dkr.ecr.us-east-1.amazonaws.com/sonar-ecr:latest
          docker push 171257943898.dkr.ecr.us-east-1.amazonaws.com/sonar-ecr:latest
        env:
          DOCKER_CLI_ACI: 1

  deploy:
    name: Deploy
    needs: build
    runs-on: [self-hosted]
    steps:
    
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Authenticate Docker to ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 171257943898.dkr.ecr.us-east-1.amazonaws.com

      - name: Docker pull image
        run: docker pull 171257943898.dkr.ecr.us-east-1.amazonaws.com/sonar-ecr:latest

      - name: Image scan
        run: trivy image 171257943898.dkr.ecr.us-east-1.amazonaws.com/sonar-ecr:latest > trivyimagedeploy.txt

      - name: Stop and remove existing container
        run: |
          docker stop swiggy-clone || true
          docker rm swiggy-clone || true

      - name: Deploy to container
        run: docker run -d --name swiggy-clone -p 3000:3000 171257943898.dkr.ecr.us-east-1.amazonaws.com/sonar-ecr:latest

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region us-east-1 --name EKS_CLOUD
